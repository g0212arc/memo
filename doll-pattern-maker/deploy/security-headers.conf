# セキュリティ用の応答ヘッダー（2026-10-04）。nginx は location で add_header を書くと上の階層の add_header が効かなくなるので、
# server と各 location の両方でこのファイルを include する。
# CSP: 自分のサイト以外のスクリプト・スタイル・接続を許さない。PDF の文字画像（data:）とダウンロード（blob:）だけ画像に許す。
# 外のサイトへのリンク（注意書きの note など）は移動なので CSP の対象外。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# ファイルの種類を推測させない
add_header X-Content-Type-Options "nosniff" always;
# ほかのサイトの中に埋め込ませない（古いブラウザ用。新しいブラウザは CSP の frame-ancestors）
add_header X-Frame-Options "DENY" always;
# 外のサイトへ移るとき、URL の中身を渡さない
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 使わない機能は止める
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
