# ホストの nginx 用。/etc/nginx/sites-available/tcpattern に置き、sites-enabled にリンクする。
# HTTPS（443）の設定は `sudo certbot --nginx -d tcpattern.duckdns.org` が自動で追記する。
server {
    listen 80;
    server_name tcpattern.duckdns.org;

    # 静的ファイルだけなので大きなアップロードは受けない
    client_max_body_size 1m;

    # Basic 認証を使う場合は、手順書の「Basic 認証」で .htpasswd を作ってから次の2行のコメントを外す
    # auth_basic "doll-pattern-maker";
    # auth_basic_user_file /etc/nginx/.htpasswd-tcpattern;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
