name: doll-pattern-maker

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: doll-pattern-maker:latest
    # 127.0.0.1 だけで待ち受ける。外からはホストの nginx 経由
    ports:
      - "127.0.0.1:${PORT:-8200}:80"
    restart: unless-stopped
    # 静的ファイルを配るだけなので小さく制限する（実測 数MB）
    mem_limit: 64m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
