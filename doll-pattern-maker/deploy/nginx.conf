# コンテナ内の nginx（権限を持たない nginx-unprivileged。8080 で待ち受け）。
# 外部公開はホストの nginx が担当し、ここは 127.0.0.1:8200 経由でだけ届く
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # バージョンを出さない
    server_tokens off;

    # 静的ファイルを配るだけなので、読む操作（GET・HEAD）以外は受け付けない
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # ビルドごとにファイル名が変わるので長くキャッシュしてよい
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html は毎回確認させ、更新がすぐ反映されるようにする
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
