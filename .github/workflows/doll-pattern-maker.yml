name: doll-pattern-maker

# テストとビルドだけを行う。公開は VPS で deploy.sh を実行する（doll-pattern-maker/deploy/README.md）
on:
  push:
    paths:
      - 'doll-pattern-maker/**'
      - '.github/workflows/doll-pattern-maker.yml'
  pull_request:
    paths:
      - 'doll-pattern-maker/**'

defaults:
  run:
    working-directory: doll-pattern-maker/app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doll-pattern-maker/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
