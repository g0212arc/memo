name: doll-pattern-maker

# テストとビルド → 通れば VPS に反映（手順: doll-pattern-maker/deploy/README.md「push で自動デプロイ」）
on:
  push:
    paths:
      - 'doll-pattern-maker/**'
      - '.github/workflows/doll-pattern-maker.yml'
  pull_request:
    paths:
      - 'doll-pattern-maker/**'

# 既定は読み取りだけ（必要な権限はジョブごとに足す）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doll-pattern-maker/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doll-pattern-maker/app/package-lock.json
      - run: npm ci
      # サイトで使う部品に重大な脆弱性があればここで止める（デプロイしない）
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/pattern-maker-doll-support-ee7mua'
    runs-on: ubuntu-latest
    # デプロイが重ならないよう1つずつ実行する
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - name: VPS で deploy.sh を実行
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$HOST" ]; then
            echo "::notice::VPS_SSH_KEY / VPS_KNOWN_HOSTS / VPS_HOST が未設定のため、デプロイをスキップしました"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # VPS 側でこの鍵は deploy.sh しか実行できない（authorized_keys の command= 制限）
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes "deploy@${HOST}"
