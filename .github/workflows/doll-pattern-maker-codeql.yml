name: doll-pattern-maker CodeQL

# コードに危ない書き方がないかを GitHub の CodeQL で自動で調べる（公開リポジトリは無料）。結果は Security タブの Code scanning に出る
on:
  push:
    branches: ['claude/pattern-maker-doll-support-ee7mua']
    paths:
      - 'doll-pattern-maker/app/**'
      - '.github/workflows/doll-pattern-maker-codeql.yml'
  pull_request:
    paths:
      - 'doll-pattern-maker/app/**'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          source-root: doll-pattern-maker/app
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: doll-pattern-maker
